    확인일: 2026-10-16

종별_교량_용어:
    최대경간장: "한 경간에서 상부구조의 교각과 교각의 중심선 간의 거리를 경간장으로 정의할 때, 교량의 경간장 중에서 최댓값. 한 경간 교량은 교량 양측 교대의 흉벽 사이를 교량 중심선에 따라 측정한 거리"
    연장: "교량 양측 교대의 흉벽 사이를 교량 중심선에 따라 측정한 거리"
    출처: "시행령 별표 1 비고 제2호·제3호"
    확인: true
    확인일: 2026-10-16

