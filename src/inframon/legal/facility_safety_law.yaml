    확인일: 2026-10-16
  - 종별: 1
    대상: 철도교량
    조건:
      - "고속철도 교량"
      - "도시철도의 교량 및 고가교"
      - "상부구조형식이 트러스교 및 아치교인 교량"
      - "연장 500미터 이상의 교량"
    출처: "시행령 별표 1 제1호나목"
    확인: true
    확인일: 2026-10-16
  - 종별: 2
    대상: 도로교량
    조건:
      - "경간장 50미터 이상인 한 경간 교량"
      - "제1종시설물에 해당하지 않는 교량으로서 연장 100미터 이상의 교량"
      - "제1종시설물에 해당하지 않는 복개구조물로서 폭 6미터 이상인 부분이 포함되어 있고 연장 100미터 이상인 복개구조물"
    기계판정: {한경간_경간장_m_이상: 50, 연장_m_이상: 100, 복개: {폭_m_이상: 6, 연장_m_이상: 100}}
    출처: "시행령 별표 1 제1호가목 (제2종시설물 열)"
    확인: true
    확인일: 2026-10-16
  - 종별: 2
    대상: 철도교량
    조건:
      - "제1종시설물에 해당하지 않는 교량으로서 연장 100미터 이상의 교량"
    출처: "시행령 별표 1 제1호나목 (제2종시설물 열)"
    확인: true
    확인일: 2026-10-16
  - 종별: 3
