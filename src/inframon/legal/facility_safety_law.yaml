# 시설물안전법 관련 기준 (교량, inframon 용)
# 모든 값은 아래 '출처'의 원문에서 직접 확인한 것만 적었다. 확인 못 한 것은 확인: false + 메모.
# law.go.kr 본문은 lsInfoR.do 로, 별표는 flDownload.do PDF 로 받아 읽었다 (2026-10-16).

메타:
  작성일: 2026-10-16
  주의: >-
    InSAR 산출은 법정 안전점검·정밀안전점검·정밀안전진단·성능평가를 대체하지 않는다.
    법(제2조제5호)은 안전점검을 "경험과 기술을 갖춘 자가 육안이나 점검기구 등으로 검사"하는 행위로 정의하고,
    안전등급은 책임기술자가 세부지침의 상태평가·안전성평가 기준으로 정한다.
    InSAR 는 관리주체의 참고·선별(스크리닝) 자료로만 쓴다.
  법령_원문_경로: law.go.kr lsInfoP.do (lsiSeq 별), 별표는 flDownload.do?flSeq=... (PDF)

법령:
  - id: act
    명칭: 시설물의 안전 및 유지관리에 관한 특별법 (시설물안전법)
    번호: 법률 제21411호
    공포일: 2026-02-27
    시행일: 2026-08-28
    개정구분: 일부개정
    출처: "https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=283765&efYd=20260828 (머리말 [시행 2026. 8. 28.] [법률 제21411호, 2026. 2. 27., 일부개정])"
    확인: true
    확인일: 2026-10-16
  - id: decree
    명칭: 시설물의 안전 및 유지관리에 관한 특별법 시행령
    번호: 대통령령 제36689호
    공포일: 2026-09-15
    시행일: 2026-09-15
    개정구분: 타법개정
    출처: "https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=289677&efYd=20260915 (머리말 [시행 2026. 9. 15.] [대통령령 제36689호, 2026. 9. 15., 타법개정])"
    확인: true
    확인일: 2026-10-16
  - id: rule
    명칭: 시설물의 안전 및 유지관리에 관한 특별법 시행규칙
    번호: 국토교통부령 제1613호
    공포일: 2026-08-14
    시행일: 2026-08-28
    개정구분: 일부개정
    출처: "https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=288721&efYd=20260828 (머리말 [시행 2026. 8. 28.] [국토교통부령 제1613호, 2026. 8. 14., 일부개정])"
    확인: true
    확인일: 2026-10-16
  - id: notice
    명칭: 시설물의 안전 및 유지관리 실시 등에 관한 지침 (국토교통부 고시)
    번호: 국토교통부고시 제2026-444호
    공포일: 2026-08-21
    시행일: 2026-08-21
    개정구분: 일부개정
    메모: 제3조(적용범위) ②항 — 이 지침에 정하지 않은 방법·절차는 국토안전관리원이 국토교통부장관 승인을 거쳐 정하는 「세부지침」을 따른다.
    출처: "https://www.law.go.kr/LSW/admRulInfoP.do?admRulSeq=2100000284032 (머리말; 제3조 ②)"
    확인: true
    확인일: 2026-10-16
  - id: guideline_inspection
    명칭: 시설물의 안전 및 유지관리 실시 세부지침 (안전점검·진단 편)
    판: 2021. 12. (본 파일에서 읽은 판)
    메모: >-
      2021.12 판 PDF(1,100쪽)를 직접 읽었다. 2025년에 상위 고시 개정 행정예고(국토교통부 공고 제2025-227호, 제2025-379호)가
      있었으므로 세부지침도 더 최신 판이 있을 수 있다. 현행 판 여부는 확인하지 못했다.
    출처: "http://www.assi.or.kr/download/law/시설물의 안전 및 유지관리 실시 세부지침(안전점검·진단편).pdf (표지 '2021. 12.')"
    확인: false   # 판 자체는 확인, '현행 판' 여부만 미확인
    확인일: 2026-10-16

종별_교량:
  # 시행령 제4조 → 별표 1 (<개정 2025. 12. 2.>). 법 제7조에도 요약 기준(1종: 고속철도 교량·연장 500m 이상 도로·철도 교량, 2종: 연장 100m 이상 도로·철도 교량)이 있다.
  - 종별: 1
    대상: 도로교량
    조건:
      - "상부구조형식이 현수교, 사장교, 아치교 및 트러스교인 교량"
      - "최대 경간장 50미터 이상의 교량(한 경간 교량은 제외한다)"
      - "연장 500미터 이상의 교량"
      - "폭 12미터 이상인 부분이 포함되어 있고 연장 500미터 이상인 복개구조물"
    기계판정: {상부형식: [현수교, 사장교, 아치교, 트러스교], 최대경간장_m_이상: 50, 한경간_제외: true, 연장_m_이상: 500, 복개: {폭_m_이상: 12, 연장_m_이상: 500}}
    출처: "시행령 별표 1 제1호가목 (flSeq=169120483 PDF: https://www.law.go.kr/LSW/flDownload.do?flSeq=169120483&bylClsCd=110201)"
